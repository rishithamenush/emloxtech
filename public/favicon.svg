        />
        <path
          d="M143 96 C184 83 211 121 233 160 L423 481"
          fill="none"
          stroke="#efffb9"
          stroke-opacity=".65"
          stroke-width="2"
        />
        <path
          d="M446 96 C454 141 429 171 405 204 L175 485"
          fill="none"
          stroke="#efffb9"
          stroke-opacity=".55"
          stroke-width="2"
        />
