<a class="skip-link" [href]="skipHref()">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/" aria-label="EmloX Tech home"
    ><span class="brand-name"
      ><span>Emlo</span
      ><img class="brand-ribbon-x" src="emlox-logo.svg" alt="" width="38" height="40" /></span
    ><span class="brand-tec">TECH</span></a
  >
  <nav id="main-navigation" aria-label="Main navigation" [class.is-open]="menuOpen()">
    <a routerLink="/services" routerLinkActive="active">Services</a
    ><a routerLink="/work" routerLinkActive="active">Concepts</a
    ><a routerLink="/about" routerLinkActive="active">About us</a
    ><a routerLink="/insights" routerLinkActive="active">Notes</a
    ><a routerLink="/contact" class="nav-cta"
      >Discuss a project <span><app-icon name="message" /></span
    ></a>
  </nav>
  <button
    class="menu-toggle"
    (click)="menuOpen.set(!menuOpen())"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
    aria-controls="main-navigation"
    (keydown.escape)="menuOpen.set(false)"
  >
    {{ menuOpen() ? 'Close −' : 'Menu + ' }}
  </button>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer>
  <div class="footer-top">
    <a class="brand" routerLink="/" aria-label="EmloX Tech home"
      ><span class="brand-name"
        ><span>Emlo</span
        ><img class="brand-ribbon-x" src="emlox-logo.svg" alt="" width="38" height="40" /></span
      ><span class="brand-tec">TECH</span></a
    >
    <p>Design & engineering.<br />From Sri Lanka, for teams everywhere.</p>
    <a class="footer-mail" href="mailto:info@emloxtech.com"
      ><app-icon name="mail" />info&#64;emloxtech.com</a
    >
  </div>
  <div class="footer-bottom">
    <span>© {{ year }} EmloX Tech.</span><span>Sri Lanka · UTC+5:30</span
    ><a routerLink="/contact">Get in touch <app-icon name="message" /></a>
  </div>
</footer>
