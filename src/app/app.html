<a class="skip-link" [href]="skipHref()">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/" aria-label="EmloX Tech home"
    ><span class="brand-name"><span>Emlo</span><img class="brand-ribbon-x" src="emlox-logo.svg" alt="" width="38" height="40" /></span><span class="brand-tec">TECH</span></a
  >
  <nav id="main-navigation" aria-label="Main navigation" [class.is-open]="menuOpen()">
    <a routerLink="/services" routerLinkActive="active">Services</a
    ><a routerLink="/work" routerLinkActive="active">Work</a
    ><a routerLink="/about" routerLinkActive="active">About us</a
    ><a routerLink="/insights" routerLinkActive="active">Insights</a
    ><a routerLink="/contact" class="nav-cta">Let’s talk <span>↗&#xFE0E;</span></a>
  </nav>
  <button
    class="menu-toggle"
    (click)="menuOpen.set(!menuOpen())"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
    aria-controls="main-navigation"
    (keydown.escape)="menuOpen.set(false)"
  >
    {{ menuOpen() ? 'Close −' : 'Menu + ' }}
  </button>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer>
  <div class="footer-top">
    <a class="brand" routerLink="/" aria-label="EmloX Tech home"
      ><span class="brand-name"><span>Emlo</span><img class="brand-ribbon-x" src="emlox-logo.svg" alt="" width="38" height="40" /></span><span class="brand-tec">TECH</span></a
    >
    <p>Good people.<br />Extraordinary possibilities.</p>
    <a class="footer-mail" href="mailto:info@emloxtech.com">info&#64;emloxtech.com ↗&#xFE0E;</a>
  </div>
  <div class="footer-bottom">
    <span>© {{ year }} EmloX Tech.</span><span>Made with purpose. Based in Sri Lanka.</span
    ><a routerLink="/contact">Get in touch ↗&#xFE0E;</a>
  </div>
</footer>
